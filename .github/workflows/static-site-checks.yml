name: Static site checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify required site files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vercel.json
          test -f robots.txt
          test -f sitemap.xml

      - name: Check HTML files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.html' -print0 | while IFS= read -r -d '' file; do
            test -s "$file"
          done
