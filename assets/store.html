<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Store | Terencio Verde</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4efe5;
      color: #18231c;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: #143426;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    main {
      padding: 80px 7%;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.8rem;
      color: #477157;
      margin-bottom: 16px;
      font-weight: bold;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(3.5rem, 8vw, 6rem);
      line-height: 0.95;
      margin-bottom: 20px;
    }

    .intro {
      max-width: 700px;
      color: #5b625d;
      line-height: 1.7;
      margin-bottom: 50px;
    }

    .empty-message {
      padding: 30px;
      background: white;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
      color: #5b625d;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.25s ease;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #ded8cd;
    }

    .product-info {
      padding: 20px;
    }

    .product-info small {
      color: #5f715f;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-info h2 {
      font-family: Georgia, serif;
      font-size: 1.7rem;
      margin: 6px 0;
    }

    .price {
      font-weight: bold;
      color: #143426;
    }

    .nfc-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      background: #e5eee8;
      color: #315641;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 3px;
    }

    dialog {
      width: min(760px, 92vw);
      border: none;
      border-radius: 10px;
      padding: 0;
      box-shadow: 0 30px 90px rgba(0,0,0,0.3);
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.72);
    }

    .modal {
      padding: 32px;
    }

    .close {
      float: right;
      border: none;
      background: transparent;
      font-size: 1.7rem;
      cursor: pointer;
    }

    .modal h2 {
      font-family: Georgia, serif;
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .modal p {
      color: #5a615c;
      line-height: 1.7;
      margin-top: 14px;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 22px 0;
    }

    .size-button {
      padding: 9px 14px;
      border: 1px solid #bdbdbd;
      background: white;
      cursor: pointer;
    }

    .size-button.selected {
      background: #143426;
      color: white;
      border-color: #143426;
    }

    .buy-button {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: none;
      background: #143426;
      color: white;
      font-size: 1rem;
      border-radius: 4px;
    }

    .buy-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    footer {
      margin-top: 80px;
      background: #0d271b;
      color: rgba(255,255,255,0.65);
      padding: 40px 7%;
    }

    @media(max-width: 850px) {
      nav {
        display: none;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    <strong>TERENCIO VERDE</strong>
  </a>

  <nav>
    <a href="hometown.html">Hometown</a>
    <a href="collaborations.html">Artist Collabs</a>
    <a href="web3.html">Web3</a>
    <a href="interactive.html">Interactive</a>
  </nav>

</header>

<main>

  <div class="eyebrow">
    Terencio Verde Store
  </div>

  <h1>
    THE GOODS.
  </h1>

  <p class="intro">
    Products can be prepared here before the public store is launched.
    Checkout will remain disabled until the payment system is connected.
  </p>

  <div
    class="product-grid"
    id="productGrid">
  </div>

</main>

<dialog id="productDialog">

  <div class="modal">

    <button
      class="close"
      onclick="productDialog.close()">
      ×
    </button>

    <h2 id="modalName"></h2>

    <div
      class="price"
      id="modalPrice">
    </div>

    <p id="modalDescription"></p>

    <div
      class="sizes"
      id="modalSizes">
    </div>

    <button
      class="buy-button"
      id="buyButton"
      disabled>
      Checkout coming soon
    </button>

  </div>

</dialog>

<footer>
  © 2026 Terencio Verde
</footer>


<!--
  PRODUCT DATABASE

  This pulls all product information from:

  assets/products/products.js
-->

<script src="assets/products/products.js"></script>


<script>

  const productGrid =
    document.getElementById("productGrid");

  const productDialog =
    document.getElementById("productDialog");

  const modalName =
    document.getElementById("modalName");

  const modalPrice =
    document.getElementById("modalPrice");

  const modalDescription =
    document.getElementById("modalDescription");

  const modalSizes =
    document.getElementById("modalSizes");


  /*
    Only products with:

    active: true

    will appear in the store.
  */

  const products =
    (window.TERENCIO_PRODUCTS || [])
    .filter(product => product.active === true);


  if (products.length === 0) {

    productGrid.innerHTML = `

      <div class="empty-message">
        Store products are currently being prepared.
      </div>

    `;

  }


  products.forEach(product => {

    const card =
      document.createElement("article");

    card.className =
      "product-card";


    const nfcBadge =
      product.nfcEnabled
      ? `<div class="nfc-badge">Interactive Garment</div>`
      : "";


    card.innerHTML = `

      <img
        class="product-image"
        src="${product.image}"
        alt="${product.name}"
      >

      <div class="product-info">

        <small>
          ${product.collection}
        </small>

        <h2>
          ${product.name}
        </h2>

        <div class="price">
          $${product.price.toFixed(2)}
        </div>

        ${nfcBadge}

      </div>

    `;


    card.addEventListener(
      "click",
      () => openProduct(product)
    );


    productGrid.appendChild(card);

  });


  function openProduct(product) {

    modalName.textContent =
      product.name;

    modalPrice.textContent =
      "$" + product.price.toFixed(2);

    modalDescription.textContent =
      product.description;

    modalSizes.innerHTML = "";


    product.sizes.forEach(size => {

      const button =
        document.createElement("button");

      button.className =
        "size-button";

      button.textContent =
        size;


      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".size-button")
            .forEach(btn =>
              btn.classList.remove("selected")
            );

          button.classList.add("selected");

        }
      );


      modalSizes.appendChild(button);

    });


    productDialog.showModal();

  }

</script>

</body>
</html>
